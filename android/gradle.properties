org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Keep Android builds on a JDK supported by AGP 8.x without changing the
# machine-wide Java installation.
org.gradle.java.home=C:\\Program Files\\Java\\jdk-21
android.useAndroidX=true
# Keep the legacy Kotlin/AGP interfaces while plugins such as Jitsi and
# file_picker have not yet migrated to built-in Kotlin.
android.newDsl=false
android.builtInKotlin=false
